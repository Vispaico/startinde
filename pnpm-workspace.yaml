packages:
  - "packages/*"
  - "apps/*"

autoInstallPeers: true
allowBuilds:
  nx: true
  "@parcel/watcher": true
  less: true
  sharp: true
  unrs-resolver: true
  esbuild: true
  "@swc/core": true
  prisma: true
  "@prisma/client": true
  bcrypt: true
  "@bcryptjs": true
  argon2: true
  "@nestjs/core": true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm64@1.2.2'
